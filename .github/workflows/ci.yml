name: MochiPort CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, and test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked -p mochiport --all-targets

      - name: Test
        run: cargo test --locked -p mochiport --all-targets

      - name: Export management contract schema
        run: cargo test --locked -p mochiport --lib write_management_contract_schema

      - name: Check generated client contracts
        run: |
          set -euo pipefail
          python3 scripts/generate-client-contracts.py \
            contracts/manage-contracts.schema.json \
            --swift macos/MochiPort/Sources/MochiPortMac/Generated/ManageContracts.swift \
            --typescript windows/MochiPort/src/api/generated/manageContracts.ts \
            --check

  windows-client:
    name: Windows client crate
    # `windows/MochiPort/src-tauri` is a member of the root workspace, but it is
    # deliberately not covered by the `rust` job: listing it there would not work
    # (Tauri needs the platform's webview toolchain, and cross-checking from Linux
    # fails in `ring`'s C code without the MSVC headers). Without this job the
    # crate would only ever be compiled during a release, so a broken build or a
    # failing test would surface at tag time instead of on the pull request.
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target

      - name: Check
        run: cargo check --locked -p mochiport-windows --all-targets

      - name: Test
        run: cargo test --locked -p mochiport-windows --all-targets

  swiftui:
    name: SwiftUI macOS shell
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Generate Swift version
        run: |
          set -euo pipefail
          UI_VERSION="$(sed -n 's/^MARKETING_VERSION *= *\([^ ]*\).*/\1/p' macos/MochiPort/Config/Version.xcconfig | head -n 1)"
          MOCHIPORT_UI_VERSION="$UI_VERSION" \
            MOCHIPORT_UI_BUILD_NUMBER="${{ github.run_number }}" \
            scripts/generate-swift-version.sh macos/MochiPort/Config/Version.xcconfig

      - name: Build SwiftUI shell
        run: |
          set -euo pipefail
          xcodebuild build \
            -project macos/MochiPort/MochiPort.xcodeproj \
            -scheme MochiPort \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MochiPortDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test SwiftUI shell
        run: |
          set -euo pipefail
          xcodebuild test \
            -project macos/MochiPort/MochiPort.xcodeproj \
            -scheme MochiPort \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/MochiPortDerivedData" \
            CODE_SIGNING_ALLOWED=NO
