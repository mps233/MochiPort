<?xml version="1.0" encoding="UTF-8"?>
<!--
  MochiPort "Bridge Mochi" concept mark.

  This is an exploratory master and is intentionally not wired to either
  platform bundle. The body is an original port/bridge silhouette; the face
  keeps the existing Mochi language while the green packet is the sole
  functional accent.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MochiPort Bridge Mochi concept</title>
  <desc>A soft mochi character shaped like a local relay port with one green handoff packet.</desc>

  <defs>
    <linearGradient id="background" x1="0.06" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#1865EE"/>
      <stop offset="1" stop-color="#3FA1F9"/>
    </linearGradient>

    <linearGradient id="bodyFill" x1="0.18" y1="0.04" x2="0.82" y2="0.98">
      <stop offset="0" stop-color="#F8F6F5"/>
      <stop offset="0.56" stop-color="#CEEDF0"/>
      <stop offset="1" stop-color="#8CCED9"/>
    </linearGradient>

    <linearGradient id="bodyEdge" x1="0.12" y1="0.02" x2="0.88" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#5AAEBE" stop-opacity="0.52"/>
    </linearGradient>

    <filter id="bodyShadow" x="-24%" y="-24%" width="148%" height="180%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>

    <filter id="portShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>

    <clipPath id="bodyClip">
      <path id="bodyShape" d="M154 478 C154 252 314 88 512 88 C710 88 870 252 870 478 L870 650 C870 820 774 930 636 930 L590 930 L590 758 C590 700 557 666 512 666 C467 666 434 700 434 758 L434 930 L388 930 C250 930 154 820 154 650 Z"/>
    </clipPath>
  </defs>

  <!-- Quiet full-bleed background; platform masks remain external. -->
  <rect width="1024" height="1024" fill="url(#background)"/>
  <path d="M0 760 C260 670 610 700 1024 890 L1024 1024 L0 1024 Z" fill="#121212" fill-opacity="0.14"/>

  <!-- Short, diffuse contact shadow subordinate to the silhouette. -->
  <ellipse cx="512" cy="936" rx="300" ry="34" fill="#121212" fill-opacity="0.24" filter="url(#bodyShadow)"/>

  <!-- Original bridge-like Mochi body. -->
  <g transform="rotate(-2.5 512 520)">
    <use href="#bodyShape" fill="#173D61" fill-opacity="0.30" filter="url(#bodyShadow)" transform="translate(0 16)"/>
    <use href="#bodyShape" fill="url(#bodyFill)" stroke="url(#bodyEdge)" stroke-width="8" stroke-linejoin="round"/>

    <!-- Broad upper-left light; no micro texture. -->
    <g clip-path="url(#bodyClip)">
      <ellipse cx="360" cy="220" rx="290" ry="138" fill="#FFFFFF" fill-opacity="0.30"/>
      <path d="M164 594 C310 480 498 458 692 514" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="34" stroke-linecap="round" filter="url(#portShadow)"/>
    </g>

    <!-- The concave lower edge is the single port/bridge signature. -->
    <path d="M434 930 L434 758 C434 700 467 666 512 666 C557 666 590 700 590 758 L590 930 Z" fill="#12304B" fill-opacity="0.78"/>
    <path d="M434 758 C434 700 467 666 512 666 C557 666 590 700 590 758" fill="none" stroke="#17415E" stroke-opacity="0.26" stroke-width="18" stroke-linecap="round" filter="url(#portShadow)"/>

    <!-- One functional hook: a packet passing through the port. -->
    <rect x="456" y="782" width="112" height="42" rx="21" fill="#60F32E"/>
    <rect x="476" y="793" width="42" height="8" rx="4" fill="#F8F6F5" fill-opacity="0.82"/>
  </g>

  <!-- Existing Mochi face language, with a slight directional tilt. -->
  <g transform="rotate(-2.5 512 520)">
    <rect x="414" y="384" width="34" height="150" rx="17" fill="#454B53"/>
    <rect x="576" y="384" width="34" height="150" rx="17" fill="#454B53"/>
    <ellipse cx="346" cy="574" rx="55" ry="55" fill="#D8A5B2" fill-opacity="0.86"/>
    <ellipse cx="678" cy="574" rx="55" ry="55" fill="#D8A5B2" fill-opacity="0.86"/>
  </g>
</svg>
