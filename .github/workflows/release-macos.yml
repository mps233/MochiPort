name: MochiPort macOS release

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to publish from a manual tagged run
        required: true
        default: all
        type: choice
        options:
          - all
          - ui
          - daemon
  push:
    tags:
      - "v*"
      - "ui-v*"
      - "daemon-v*"

permissions:
  contents: write

jobs:
  build-sign-notarize:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: xcode-27
            file_slug: universal
            asset_key: macos-universal
            sparkle_key: macos-sparkle-universal
            manifest_name: latest-macos.json
            intel_manifest_name: latest-macos-intel.json
    env:
      HAS_MACOS_CODESIGN: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' && secrets.APPLE_CODESIGN_IDENTITY != '' && (secrets.NOTARY_KEYCHAIN_PROFILE != '' || (secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '') || (secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '')) }}
      MACOS_FILE_SLUG: ${{ matrix.file_slug }}
      MACOS_ASSET_KEY: ${{ matrix.asset_key }}
      MACOS_SPARKLE_KEY: ${{ matrix.sparkle_key }}
      MACOS_MANIFEST_NAME: ${{ matrix.manifest_name }}
      MACOS_INTEL_MANIFEST_NAME: ${{ matrix.intel_manifest_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 27
        run: |
          set -euo pipefail
          export DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer
          echo "DEVELOPER_DIR=$DEVELOPER_DIR" >> "$GITHUB_ENV"
          xcodebuild -version
          test "$(xcrun --sdk macosx --show-sdk-version | cut -d. -f1)" -ge 26

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Select Release Component
        run: |
          set -euo pipefail
          COMPONENT="${{ inputs.component || 'all' }}"
          TAG="${GITHUB_REF_NAME:-}"
          VERSION_TAG="$TAG"
          case "$TAG" in
            daemon-v*)
              COMPONENT=daemon
              VERSION_TAG="${TAG#daemon-v}"
              ;;
            ui-v*)
              COMPONENT=ui
              VERSION_TAG="${TAG#ui-v}"
              ;;
            v*) VERSION_TAG="${TAG#v}" ;;
          esac
          echo "RELEASE_COMPONENT=$COMPONENT" >> "$GITHUB_ENV"
          if [[ "$VERSION_TAG" == *-* ]]; then
            echo "RELEASE_PRERELEASE=true" >> "$GITHUB_ENV"
            echo "RELEASE_MAKE_LATEST=false" >> "$GITHUB_ENV"
          else
            echo "RELEASE_PRERELEASE=false" >> "$GITHUB_ENV"
            echo "RELEASE_MAKE_LATEST=true" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID Certificate
        if: env.HAS_MACOS_CODESIGN == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          export CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          python3 -c 'import base64, os, pathlib; pathlib.Path(os.environ["CERT_PATH"]).write_bytes(base64.b64decode(os.environ["APPLE_CERTIFICATE_P12_BASE64"]))'
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

      - name: Build App Bundle
        run: |
          set -euo pipefail
          DAEMON_BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}"
          XCODE_DERIVED_DATA="$RUNNER_TEMP/MochiPortDerivedData"

          MOCHIPORT_DAEMON_BUILD_NUMBER="$DAEMON_BUILD_NUMBER" \
            cargo build --locked --release --bin mochiport --target aarch64-apple-darwin
          MOCHIPORT_DAEMON_BUILD_NUMBER="$DAEMON_BUILD_NUMBER" \
            cargo build --locked --release --bin mochiport --target x86_64-apple-darwin

          mkdir -p target/release
          lipo -create \
            target/aarch64-apple-darwin/release/mochiport \
            target/x86_64-apple-darwin/release/mochiport \
            -output target/release/mochiport

          rm -rf "$XCODE_DERIVED_DATA"
          xcodebuild \
            -project macos/MochiPort/MochiPort.xcodeproj \
            -scheme MochiPort \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$XCODE_DERIVED_DATA" \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

          mkdir -p target/dist
          scripts/assemble-swiftui-macos-app.sh \
            "$DAEMON_BUILD_NUMBER" \
            "$XCODE_DERIVED_DATA/Build/Products/Release/MochiPort.app" \
            target/release/mochiport \
            target/dist/MochiPort.app

          UI_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' target/dist/MochiPort.app/Contents/Info.plist)"
          UI_BUILD_NUMBER="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' target/dist/MochiPort.app/Contents/Info.plist)"
          DAEMON_VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$UI_VERSION" ] || [ -z "$UI_BUILD_NUMBER" ] || [ -z "$DAEMON_VERSION" ]; then
            echo "Could not resolve independent UI and daemon versions" >&2
            exit 1
          fi
          {
            echo "MOCHIPORT_UI_VERSION=$UI_VERSION"
            echo "MOCHIPORT_UI_BUILD_NUMBER=$UI_BUILD_NUMBER"
            echo "MOCHIPORT_DAEMON_VERSION=$DAEMON_VERSION"
            echo "MOCHIPORT_DAEMON_BUILD_NUMBER=$DAEMON_BUILD_NUMBER"
            echo "MACOS_DMG_NAME=MochiPort-$UI_VERSION-build$UI_BUILD_NUMBER-macos-$MACOS_FILE_SLUG.dmg"
            echo "MACOS_APP_ZIP_NAME=MochiPort-$UI_VERSION-build$UI_BUILD_NUMBER-macos-$MACOS_FILE_SLUG.app.zip"
            echo "MACOS_DAEMON_NAME=mochiport-daemon-$DAEMON_VERSION-build$DAEMON_BUILD_NUMBER-macos-$MACOS_FILE_SLUG"
          } >> "$GITHUB_ENV"

      - name: Sign And Notarize
        if: env.HAS_MACOS_CODESIGN == 'true'
        timeout-minutes: 75
        env:
          APPLE_CODESIGN_IDENTITY: ${{ secrets.APPLE_CODESIGN_IDENTITY }}
          NOTARY_KEYCHAIN_PROFILE: ${{ secrets.NOTARY_KEYCHAIN_PROFILE }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          APP="target/dist/MochiPort.app"
          DMG="target/dist/MochiPort.dmg"
          DMG_STAGING="target/dist/dmg"
          ZIP="target/dist/${MACOS_APP_ZIP_NAME}"
          NOTARY_ZIP="target/dist/MochiPort-notary.zip"
          ENTITLEMENTS="packaging/macos/entitlements.plist"
          DAEMON="target/release/mochiport"
          DAEMON_ASSET="target/dist/${MACOS_DAEMON_NAME}"

          if [ -n "${APPLE_API_KEY_P8:-}" ]; then
            API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$API_KEY_PATH"
            chmod 600 "$API_KEY_PATH"
            export APPLE_API_KEY_PATH="$API_KEY_PATH"
          fi

          run_with_timeout() {
            local timeout_seconds="$1"
            shift
            python3 - "$timeout_seconds" "$@" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          timeout = int(sys.argv[1])
          command = sys.argv[2:]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              return_code = process.wait(timeout=timeout)
          except subprocess.TimeoutExpired:
              print(f"Command timed out after {timeout} seconds: {command[0]}", file=sys.stderr)
              os.killpg(process.pid, signal.SIGTERM)
              try:
                  process.wait(timeout=10)
              except subprocess.TimeoutExpired:
                  os.killpg(process.pid, signal.SIGKILL)
                  process.wait()
              sys.exit(124)
          sys.exit(return_code)
          PY
          }

          notary_submit() {
            local path="$1"
            local -a auth_args
            if [ -n "${NOTARY_KEYCHAIN_PROFILE:-}" ]; then
              auth_args=(--keychain-profile "$NOTARY_KEYCHAIN_PROFILE")
            elif [ -n "${APPLE_API_KEY_ID:-}" ]; then
              auth_args=(
                --key "$APPLE_API_KEY_PATH" \
                --key-id "$APPLE_API_KEY_ID" \
                --issuer "$APPLE_API_ISSUER_ID"
              )
            else
              auth_args=(
                --apple-id "$APPLE_ID" \
                --team-id "$APPLE_TEAM_ID" \
                --password "$APPLE_APP_SPECIFIC_PASSWORD"
              )
            fi

            local attempt status
            for attempt in 1 2 3; do
              local -a submit_args=(xcrun notarytool submit "$path" "${auth_args[@]}")
              if [ "$attempt" -gt 1 ]; then
                submit_args+=(--no-s3-acceleration)
              fi
              echo "Submitting $path for notarization (attempt $attempt/3)..."
              if run_with_timeout 1200 \
                "${submit_args[@]}" \
                --wait --timeout 15m; then
                return 0
              else
                status=$?
              fi
              if [ "$attempt" -lt 3 ]; then
                echo "Notarization attempt $attempt failed with status $status; retrying..." >&2
                sleep $((attempt * 15))
              fi
            done
            echo "Notarization failed after 3 attempts: $path" >&2
            return "$status"
          }

          codesign --force --timestamp --options runtime \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "$DAEMON"
          ditto "$DAEMON" "$APP/Contents/Helpers/mochiport-daemon"
          codesign --force --timestamp --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$APPLE_CODESIGN_IDENTITY" \
            "$APP"

          codesign --verify --strict --verbose=2 "$DAEMON"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k --keepParent "$APP" "$NOTARY_ZIP"
          notary_submit "$NOTARY_ZIP"
          xcrun stapler staple "$APP"
          rm -f "$NOTARY_ZIP"
          ditto -c -k --keepParent "$APP" "$ZIP"

          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          ditto "$APP" "$DMG_STAGING/MochiPort.app"
          ln -s /Applications "$DMG_STAGING/Applications"

          hdiutil create -volname "MochiPort" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG"
          codesign --force --timestamp --sign "$APPLE_CODESIGN_IDENTITY" "$DMG"
          notary_submit "$DMG"
          xcrun stapler staple "$DMG"
          mv "$DMG" "target/dist/${MACOS_DMG_NAME}"
          DMG="target/dist/${MACOS_DMG_NAME}"

          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG"
          spctl --assess --type execute --verbose=4 "$DAEMON"
          spctl --assess --type execute --verbose=4 "$APP"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG"
          ditto "$DAEMON" "$DAEMON_ASSET"

      - name: Package Unsigned App
        if: env.HAS_MACOS_CODESIGN != 'true'
        run: |
          set -euo pipefail
          APP="target/dist/MochiPort.app"
          DMG="target/dist/MochiPort.dmg"
          DMG_STAGING="target/dist/dmg"
          ZIP="target/dist/${MACOS_APP_ZIP_NAME}"
          DAEMON_ASSET="target/dist/${MACOS_DAEMON_NAME}"

          ditto -c -k --keepParent "$APP" "$ZIP"
          rm -rf "$DMG_STAGING"
          mkdir -p "$DMG_STAGING"
          ditto "$APP" "$DMG_STAGING/MochiPort.app"
          ln -s /Applications "$DMG_STAGING/Applications"
          hdiutil create -volname "MochiPort" -srcfolder "$DMG_STAGING" -ov -format UDZO "$DMG"
          mv "$DMG" "target/dist/${MACOS_DMG_NAME}"
          ditto target/release/mochiport "$DAEMON_ASSET"
          echo "macOS artifact is unsigned because complete signing and notarization secrets were not configured." >&2

      - name: Write macOS Update Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          MACOS_SIGNED: ${{ env.HAS_MACOS_CODESIGN }}
        run: |
          set -euo pipefail
          PREVIOUS_MANIFEST="$RUNNER_TEMP/previous-latest-macos.json"
          curl --fail --silent --show-error --location \
            "https://github.com/${RELEASE_REPOSITORY}/releases/latest/download/${MACOS_MANIFEST_NAME}" \
            --output "$PREVIOUS_MANIFEST" || rm -f "$PREVIOUS_MANIFEST"

          MANIFEST_ARGS=(
            --output "target/dist/${MACOS_MANIFEST_NAME}"
            --previous "$PREVIOUS_MANIFEST"
            --component "$RELEASE_COMPONENT"
            --repository "$RELEASE_REPOSITORY"
            --release-tag "$RELEASE_TAG"
            --ui-version "$MOCHIPORT_UI_VERSION"
            --ui-build "$MOCHIPORT_UI_BUILD_NUMBER"
            --ui-dmg "target/dist/${MACOS_DMG_NAME}"
            --ui-dmg-name "$MACOS_DMG_NAME"
            --ui-app-zip "target/dist/${MACOS_APP_ZIP_NAME}"
            --ui-app-zip-name "$MACOS_APP_ZIP_NAME"
            --daemon-version "$MOCHIPORT_DAEMON_VERSION"
            --daemon-build "$MOCHIPORT_DAEMON_BUILD_NUMBER"
            --daemon-binary "target/dist/${MACOS_DAEMON_NAME}"
            --daemon-binary-name "$MACOS_DAEMON_NAME"
            --minimum-ui-version "$MOCHIPORT_UI_VERSION"
            --minimum-ui-build "$MOCHIPORT_UI_BUILD_NUMBER"
          )
          if [ "$MACOS_SIGNED" = true ]; then
            MANIFEST_ARGS+=(--signed)
          fi
          scripts/write-macos-update-manifest.py "${MANIFEST_ARGS[@]}"

          cp "target/dist/${MACOS_MANIFEST_NAME}" \
            "target/dist/${MACOS_INTEL_MANIFEST_NAME}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiPort-macOS-${{ matrix.file_slug }}
          path: |
            target/dist/MochiPort-*-macos-${{ matrix.file_slug }}.dmg
            target/dist/MochiPort-*-macos-${{ matrix.file_slug }}.app.zip
            target/dist/mochiport-daemon-*-macos-${{ matrix.file_slug }}
            target/dist/${{ matrix.manifest_name }}
            target/dist/${{ matrix.intel_manifest_name }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_MAKE_LATEST == 'true' }}
          files: |
            target/dist/MochiPort-*-macos-${{ matrix.file_slug }}.dmg
            target/dist/MochiPort-*-macos-${{ matrix.file_slug }}.app.zip
            target/dist/mochiport-daemon-*-macos-${{ matrix.file_slug }}
            target/dist/${{ matrix.manifest_name }}
            target/dist/${{ matrix.intel_manifest_name }}
