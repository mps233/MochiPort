name: ThreadRelay CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Format, check, and test
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libclang-dev \
            libexpat1-dev \
            libgdk-pixbuf2.0-bin \
            libglib2.0-bin \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-dev \
            libjpeg-dev \
            libpng-dev \
            librsvg2-dev \
            libtiff-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Check Formatting
        run: cargo fmt --all --check

      - name: Check
        run: cargo check --locked --features gui --bin threadrelay

      - name: Test
        run: cargo test --locked --features gui --bin threadrelay

  swiftui:
    name: SwiftUI macOS shell
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Swift version
        run: |
          set -euo pipefail
          THREADRELAY_BUILD_NUMBER="${{ github.run_number }}" \
            scripts/generate-swift-version.sh macos/ThreadRelay/Config/Version.xcconfig

      - name: Build SwiftUI shell
        run: |
          set -euo pipefail
          xcodebuild build \
            -project macos/ThreadRelay/ThreadRelay.xcodeproj \
            -scheme ThreadRelay \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ThreadRelayDerivedData" \
            CODE_SIGNING_ALLOWED=NO

      - name: Test SwiftUI shell
        run: |
          set -euo pipefail
          xcodebuild test \
            -project macos/ThreadRelay/ThreadRelay.xcodeproj \
            -scheme ThreadRelay \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/ThreadRelayDerivedData" \
            CODE_SIGNING_ALLOWED=NO
