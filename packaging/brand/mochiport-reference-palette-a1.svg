<?xml version="1.0" encoding="UTF-8"?>
<!--
  MochiPort reference-palette concept a1.

  This exploratory mark preserves MochiPort's two-eye/two-cheek geometry while
  borrowing only the broad dark navy and warm yellow-orange palette from the
  supplied reference image. It is not wired to a platform bundle yet.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MochiPort reference palette concept a1</title>
  <desc>Original MochiPort face mark on a near-black navy gradient with warm yellow-orange accents.</desc>

  <defs>
    <linearGradient id="background" x1="0.04" y1="0.00" x2="0.94" y2="1.00">
      <stop offset="0" stop-color="#020307"/>
      <stop offset="0.34" stop-color="#010615"/>
      <stop offset="0.70" stop-color="#000A22"/>
      <stop offset="1" stop-color="#011332"/>
    </linearGradient>
    <radialGradient id="backgroundLift" cx="0.12" cy="0.08" r="0.96">
      <stop offset="0" stop-color="#1B2A3B" stop-opacity="0.26"/>
      <stop offset="0.46" stop-color="#0C1A2D" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSurface" x1="0.12" y1="0.02" x2="0.90" y2="0.98">
      <stop offset="0" stop-color="#6D7E8B" stop-opacity="0.12"/>
      <stop offset="0.42" stop-color="#263A53" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#0C1C35" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0.08" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#A3ADB4" stop-opacity="0.70"/>
      <stop offset="0.44" stop-color="#566675" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#263C5A" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="warmMark" x1="0.16" y1="0.08" x2="0.82" y2="0.96">
      <stop offset="0" stop-color="#FFD57F"/>
      <stop offset="0.46" stop-color="#FFC466"/>
      <stop offset="1" stop-color="#FFAA3F"/>
    </linearGradient>
    <linearGradient id="warmMarkRight" x1="0.12" y1="0.04" x2="0.88" y2="0.98">
      <stop offset="0" stop-color="#FFD071"/>
      <stop offset="0.54" stop-color="#FFC05D"/>
      <stop offset="1" stop-color="#FF9934"/>
    </linearGradient>
    <filter id="tileShadow" x="-14%" y="-14%" width="128%" height="138%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="markGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="30" y="30" width="964" height="964" rx="224"/>
    </clipPath>
  </defs>

  <!-- Keep the platform-safe transparent margin; the system owns the final mask. -->
  <g id="macos-icon-safe-area" transform="translate(512 512) scale(0.90) translate(-512 -512)">
    <g id="background-layer">
      <rect x="48" y="58" width="928" height="928" rx="214" fill="#00030A" fill-opacity="0.72" filter="url(#tileShadow)"/>
      <g clip-path="url(#iconClip)">
        <rect x="30" y="30" width="964" height="964" rx="224" fill="url(#background)"/>
        <rect x="30" y="30" width="964" height="964" rx="224" fill="url(#backgroundLift)"/>
      </g>
    </g>

    <g id="glass-layer" clip-path="url(#iconClip)">
      <rect x="58" y="58" width="908" height="908" rx="205" fill="url(#glassSurface)" stroke="url(#glassEdge)" stroke-width="4"/>
      <path d="M92 410 C260 196 556 96 900 164" fill="none" stroke="#7890A5" stroke-opacity="0.13" stroke-width="22" stroke-linecap="round" filter="url(#markGlow)"/>
      <path d="M84 285 C260 112 526 88 734 128" fill="none" stroke="#B7C4CF" stroke-opacity="0.18" stroke-width="5" stroke-linecap="round"/>
      <path d="M124 906 C366 812 690 830 928 924" fill="none" stroke="#1B4F83" stroke-opacity="0.24" stroke-width="44" stroke-linecap="round" filter="url(#markGlow)"/>
    </g>

    <!-- Existing Mochi face geometry, recolored without borrowing the reference symbol. -->
    <g id="mascot-face-layer" transform="translate(512 560) scale(26.5) translate(-38 -29)">
      <rect x="32.23" y="16.17" width="1.98" height="10.73" rx="0.99" fill="url(#warmMark)"/>
      <rect x="41.79" y="16.17" width="1.98" height="10.73" rx="0.99" fill="url(#warmMarkRight)"/>
      <ellipse cx="25.76" cy="29.12" rx="4.08" ry="4.08" fill="#FFC365"/>
      <ellipse cx="50.24" cy="29.12" rx="4.08" ry="4.08" fill="#FFAD42"/>
    </g>

    <g id="specular-layer" clip-path="url(#iconClip)">
      <path d="M132 154 C304 68 550 72 712 122" fill="none" stroke="#D6E0E8" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round" filter="url(#markGlow)"/>
      <rect x="46" y="46" width="932" height="932" rx="214" fill="none" stroke="#AEBBC5" stroke-opacity="0.20" stroke-width="2.5"/>
    </g>
  </g>
</svg>
