name: MochiPort Linux release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install System Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            desktop-file-utils \
            dpkg-dev \
            libclang-dev \
            libexpat1-dev \
            libfuse2 \
            libgdk-pixbuf2.0-bin \
            libglib2.0-bin \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libgtk-3-bin \
            libgtk-3-dev \
            libjpeg-dev \
            libpng-dev \
            librsvg2-dev \
            libtiff-dev \
            libxkbcommon-dev \
            patchelf \
            pkg-config \
            wget

      - name: Restore Cargo Cache
        uses: Swatinem/rust-cache@v2

      - name: Reset wxWidgets CMake Cache
        run: |
          set -euo pipefail
          rm -rf target/release/wxwidgets_cmake_build
          rm -rf target/release/wxdragon_sys_cmake_build

      - name: Build Release
        run: |
          set -euo pipefail
          MOCHIPORT_BUILD_NUMBER="${GITHUB_RUN_NUMBER:-1}" \
            cargo build --locked --release --features gui --bin mochiport
          strip target/release/mochiport

      - name: Prepare Release Metadata
        run: |
          set -euo pipefail
          CARGO_VERSION="$(sed -n 's/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)"
          if [ -z "$CARGO_VERSION" ]; then
            echo "Could not read package version from Cargo.toml" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            APP_VERSION="$GITHUB_REF_NAME"
          else
            APP_VERSION="v$CARGO_VERSION"
          fi
          {
            echo "APP_VERSION=$APP_VERSION"
            echo "LINUX_TARBALL_NAME=MochiPort-$APP_VERSION-linux-x86_64.tar.gz"
            echo "LINUX_APPIMAGE_NAME=MochiPort-$APP_VERSION-linux-x86_64.AppImage"
          } >> "$GITHUB_ENV"

      - name: Package Tarball
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist"
          PACKAGE_NAME="MochiPort Linux x86_64"
          PACKAGE_DIR="$DIST_ROOT/$PACKAGE_NAME"
          rm -rf "$DIST_ROOT"
          mkdir -p \
            "$PACKAGE_DIR/bin" \
            "$PACKAGE_DIR/share/applications" \
            "$PACKAGE_DIR/share/icons/hicolor/256x256/apps" \
            "$PACKAGE_DIR/brand/providers"

          python3 packaging/generate-third-party-licenses.py "$DIST_ROOT/THIRD_PARTY_LICENSES.txt"
          cp target/release/mochiport "$PACKAGE_DIR/bin/mochiport"
          cp packaging/linux/mochiport.desktop "$PACKAGE_DIR/share/applications/mochiport.desktop"
          cp packaging/icons/dolphin-rounded-256.png "$PACKAGE_DIR/share/icons/hicolor/256x256/apps/mochiport.png"
          cp README.md README.en.md LICENSE NOTICE "$DIST_ROOT/THIRD_PARTY_LICENSES.txt" "$PACKAGE_DIR/"
          cp packaging/brand/LICENSE.lucide-icons "$PACKAGE_DIR/brand/"
          cp packaging/brand/providers/LICENSE.lobehub-icons packaging/brand/providers/SOURCES.md "$PACKAGE_DIR/brand/providers/"
          if [ -f config.example.toml ]; then
            cp config.example.toml "$PACKAGE_DIR/"
          fi

          tar -C "$DIST_ROOT" -czf "$DIST_ROOT/$LINUX_TARBALL_NAME" "$PACKAGE_NAME"

      - name: Build AppImage
        env:
          VERSION: ${{ env.APP_VERSION }}
        run: |
          set -euo pipefail
          DIST_ROOT="target/dist"
          APPDIR="$DIST_ROOT/AppDir"
          rm -rf "$APPDIR"
          mkdir -p \
            "$APPDIR/usr/bin" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
            "$APPDIR/usr/share/doc/mochiport/brand/providers"

          cp target/release/mochiport "$APPDIR/usr/bin/mochiport"
          cp packaging/linux/mochiport.desktop "$APPDIR/usr/share/applications/mochiport.desktop"
          cp packaging/icons/dolphin-rounded-256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/mochiport.png"
          cp LICENSE NOTICE "$DIST_ROOT/THIRD_PARTY_LICENSES.txt" "$APPDIR/usr/share/doc/mochiport/"
          cp packaging/brand/LICENSE.lucide-icons "$APPDIR/usr/share/doc/mochiport/brand/"
          cp packaging/brand/providers/LICENSE.lobehub-icons packaging/brand/providers/SOURCES.md "$APPDIR/usr/share/doc/mochiport/brand/providers/"
          desktop-file-validate "$APPDIR/usr/share/applications/mochiport.desktop"

          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage"
          wget -q "https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          export LINUXDEPLOY_OUTPUT_VERSION="${VERSION#v}"
          ./linuxdeploy-x86_64.AppImage \
            --appdir "$APPDIR" \
            --executable "$APPDIR/usr/bin/mochiport" \
            --desktop-file "$APPDIR/usr/share/applications/mochiport.desktop" \
            --icon-file "$APPDIR/usr/share/icons/hicolor/256x256/apps/mochiport.png" \
            --plugin gtk \
            --output appimage

          rm -f linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
          APPIMAGE="$(find . -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$APPIMAGE"
          mv "$APPIMAGE" "$DIST_ROOT/$LINUX_APPIMAGE_NAME"

      - name: Write Linux Update Metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          dist = Path("target/dist")
          release_tag = os.environ["RELEASE_TAG"]
          repository = os.environ["RELEASE_REPOSITORY"]
          tarball_name = os.environ["LINUX_TARBALL_NAME"]
          appimage_name = os.environ["LINUX_APPIMAGE_NAME"]
          release_url = f"https://github.com/{repository}/releases/tag/{release_tag}"
          download_base = f"https://github.com/{repository}/releases/download/{release_tag}"

          def asset(name: str, asset_type: str) -> dict[str, object]:
              path = dist / name
              return {
                  "type": asset_type,
                  "url": f"{download_base}/{name}",
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                  "size": path.stat().st_size,
              }

          manifest = {
              "version": release_tag,
              "releaseUrl": release_url,
              "notes": "",
              "assets": {
                  "linux-x86_64": asset(tarball_name, "tar.gz"),
                  "linux-appimage-x86_64": asset(appimage_name, "appimage"),
              },
          }
          (dist / "latest-linux.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiPort-Linux
          path: |
            target/dist/MochiPort-*-linux-x86_64.AppImage
            target/dist/MochiPort-*-linux-x86_64.tar.gz
            target/dist/latest-linux.json

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          overwrite_files: true
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ contains(github.ref_name, '-') && 'false' || 'true' }}
          files: |
            target/dist/MochiPort-*-linux-x86_64.AppImage
            target/dist/MochiPort-*-linux-x86_64.tar.gz
            target/dist/latest-linux.json
