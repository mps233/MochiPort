<?xml version="1.0" encoding="UTF-8"?>
<!--
  MochiPort "Wide Relay Mochi" concept v3.

  The silhouette follows the existing wide, low Mochi companion. A single
  rounded connector behind the right side carries the relay meaning without
  turning the face into a port or mouth.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MochiPort Wide Relay Mochi concept v3</title>
  <desc>A wide soft Mochi mascot with a single side connector and green status light.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#132A48"/>
      <stop offset="1" stop-color="#0D182C"/>
    </linearGradient>
    <linearGradient id="bodyFill" x1="0.18" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#F8F6F5"/>
      <stop offset="0.58" stop-color="#CEEDF0"/>
      <stop offset="1" stop-color="#9BD5DE"/>
    </linearGradient>
    <filter id="shadow" x="-24%" y="-35%" width="148%" height="200%">
      <feGaussianBlur stdDeviation="17"/>
    </filter>
    <clipPath id="bodyClip">
      <path d="M186 500 L186 438 C186 282 328 168 512 168 C696 168 838 282 838 438 L838 610 C838 716 760 778 642 778 L382 778 C264 778 186 716 186 610 Z"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#background)"/>
  <path d="M0 788 C278 700 698 712 1024 840 L1024 1024 L0 1024 Z" fill="#1865EE" fill-opacity="0.15"/>

  <ellipse cx="512" cy="820" rx="288" ry="25" fill="#050B15" fill-opacity="0.65" filter="url(#shadow)"/>

  <!-- One supporting prop: a connector entering from the right. -->
  <g transform="rotate(-2 512 500)">
    <rect x="680" y="566" width="208" height="92" rx="46" fill="#1865EE" stroke="#081426" stroke-width="14"/>
    <circle cx="842" cy="612" r="18" fill="#60F32E"/>
    <circle cx="842" cy="612" r="7" fill="#F8F6F5" fill-opacity="0.88"/>

    <!-- Wide, low original Mochi silhouette. -->
    <path d="M186 500 L186 438 C186 282 328 168 512 168 C696 168 838 282 838 438 L838 610 C838 716 760 778 642 778 L382 778 C264 778 186 716 186 610 Z" fill="url(#bodyFill)" stroke="#081426" stroke-width="18" stroke-linejoin="round"/>

    <g clip-path="url(#bodyClip)">
      <ellipse cx="358" cy="238" rx="255" ry="88" fill="#FFFFFF" fill-opacity="0.28"/>
      <path d="M178 636 C344 574 570 572 850 654 L850 806 L178 806 Z" fill="#70BAC7" fill-opacity="0.16"/>
    </g>

    <!-- Existing two-eye, two-cheek face language. -->
    <rect x="412" y="354" width="34" height="142" rx="17" fill="#454B53"/>
    <rect x="578" y="354" width="34" height="142" rx="17" fill="#454B53"/>
    <ellipse cx="346" cy="548" rx="50" ry="50" fill="#D8A5B2" fill-opacity="0.88"/>
    <ellipse cx="678" cy="548" rx="50" ry="50" fill="#D8A5B2" fill-opacity="0.88"/>
  </g>
</svg>
