<?xml version="1.0" encoding="UTF-8"?>
<!--
  MochiPort reference-palette concept a2.

  Exploratory concept only. MochiPort's own two-eye/two-cheek geometry is
  retained while the tile and warm accents are tuned to the supplied image's
  sampled inner-icon colors. This file is not wired to a platform bundle.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>MochiPort reference palette concept a2</title>
  <desc>Original MochiPort face mark on a near-black navy gradient sampled from the supplied reference tile.</desc>

  <defs>
    <linearGradient id="background" x1="0.00" y1="0.00" x2="1.00" y2="1.00">
      <stop offset="0" stop-color="#000000"/>
      <stop offset="0.28" stop-color="#000309"/>
      <stop offset="0.62" stop-color="#000914"/>
      <stop offset="1" stop-color="#010F30"/>
    </linearGradient>
    <radialGradient id="backgroundLift" cx="0.08" cy="0.06" r="1.04">
      <stop offset="0" stop-color="#172538" stop-opacity="0.13"/>
      <stop offset="0.52" stop-color="#0A1728" stop-opacity="0.035"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassSurface" x1="0.12" y1="0.02" x2="0.90" y2="0.98">
      <stop offset="0" stop-color="#5E6D7A" stop-opacity="0.09"/>
      <stop offset="0.42" stop-color="#1D3048" stop-opacity="0.045"/>
      <stop offset="1" stop-color="#091A34" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="glassEdge" x1="0.08" y1="0.02" x2="0.94" y2="0.98">
      <stop offset="0" stop-color="#A0AAB3" stop-opacity="0.64"/>
      <stop offset="0.44" stop-color="#536372" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#263C5A" stop-opacity="0.66"/>
    </linearGradient>
    <linearGradient id="warmMark" x1="0.12" y1="0.06" x2="0.88" y2="0.98">
      <stop offset="0" stop-color="#FFD27A"/>
      <stop offset="0.50" stop-color="#FFC76B"/>
      <stop offset="1" stop-color="#FFBF5F"/>
    </linearGradient>
    <linearGradient id="warmMarkRight" x1="0.10" y1="0.04" x2="0.90" y2="0.98">
      <stop offset="0" stop-color="#FFD078"/>
      <stop offset="0.52" stop-color="#FFC465"/>
      <stop offset="1" stop-color="#FFB95A"/>
    </linearGradient>
    <filter id="tileShadow" x="-14%" y="-14%" width="128%" height="138%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="markGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="iconClip">
      <rect x="30" y="30" width="964" height="964" rx="224"/>
    </clipPath>
  </defs>

  <!-- Keep the platform-safe transparent margin; the system owns the final mask. -->
  <g id="macos-icon-safe-area" transform="translate(512 512) scale(0.90) translate(-512 -512)">
    <g id="background-layer">
      <rect x="48" y="58" width="928" height="928" rx="214" fill="#00030A" fill-opacity="0.72" filter="url(#tileShadow)"/>
      <g clip-path="url(#iconClip)">
        <rect x="30" y="30" width="964" height="964" rx="224" fill="url(#background)"/>
        <rect x="30" y="30" width="964" height="964" rx="224" fill="url(#backgroundLift)"/>
      </g>
    </g>

    <g id="glass-layer" clip-path="url(#iconClip)">
      <rect x="58" y="58" width="908" height="908" rx="205" fill="url(#glassSurface)" stroke="url(#glassEdge)" stroke-width="4"/>
      <path d="M92 410 C260 196 556 96 900 164" fill="none" stroke="#7890A5" stroke-opacity="0.10" stroke-width="22" stroke-linecap="round" filter="url(#markGlow)"/>
      <path d="M84 285 C260 112 526 88 734 128" fill="none" stroke="#B7C4CF" stroke-opacity="0.15" stroke-width="5" stroke-linecap="round"/>
      <path d="M124 906 C366 812 690 830 928 924" fill="none" stroke="#1B4F83" stroke-opacity="0.22" stroke-width="44" stroke-linecap="round" filter="url(#markGlow)"/>
    </g>

    <!-- Existing Mochi face geometry, recolored without borrowing the reference symbol. -->
    <g id="mascot-face-layer" transform="translate(512 560) scale(26.5) translate(-38 -29)">
      <rect x="32.23" y="16.17" width="1.98" height="10.73" rx="0.99" fill="url(#warmMark)"/>
      <rect x="41.79" y="16.17" width="1.98" height="10.73" rx="0.99" fill="url(#warmMarkRight)"/>
      <ellipse cx="25.76" cy="29.12" rx="4.08" ry="4.08" fill="#FFC76B"/>
      <ellipse cx="50.24" cy="29.12" rx="4.08" ry="4.08" fill="#FFBF5F"/>
    </g>

    <g id="specular-layer" clip-path="url(#iconClip)">
      <path d="M132 154 C304 68 550 72 712 122" fill="none" stroke="#D6E0E8" stroke-opacity="0.18" stroke-width="8" stroke-linecap="round" filter="url(#markGlow)"/>
      <rect x="46" y="46" width="932" height="932" rx="214" fill="none" stroke="#AEBBC5" stroke-opacity="0.18" stroke-width="2.5"/>
    </g>
  </g>
</svg>
